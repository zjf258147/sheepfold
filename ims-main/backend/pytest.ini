[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

markers =
    contract: 契约测试（API 请求/响应格式验证）
    snapshot: 快照测试（UI 组件渲染验证）
    scenario: 场景测试（端到端业务流程验证）
    slow: 标记较慢的测试用例
    smoke: 烟雾测试（基础功能验证）

# 排除前端快照测试目录
norecursedirs = frontend node_modules .git

# 覆盖率配置
# --cov=app --cov-report=term --cov-report=html