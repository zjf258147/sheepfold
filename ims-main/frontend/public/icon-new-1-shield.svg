<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="shine1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg1)"/>
  <rect x="24" y="24" width="464" height="232" rx="96" fill="url(#shine1)"/>
  <!-- 中间：盾牌 + 对勾（质检/验收） -->
  <path d="M256 105 L355 155 L355 300 Q355 400 256 445 Q157 400 157 300 L157 155 Z" fill="none" stroke="white" stroke-width="5" stroke-opacity="0.35"/>
  <path d="M210 280 L248 318 L310 235" fill="none" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow1)"/>
  <!-- 文字 -->
  <text x="256" y="458" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="bold" fill="white" fill-opacity="0.92">DL-IMS</text>
  <text x="256" y="486" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="white" fill-opacity="0.55">敦临计量</text>
</svg>