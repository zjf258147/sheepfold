<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="shine2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg2)"/>
  <rect x="24" y="24" width="464" height="232" rx="96" fill="url(#shine2)"/>
  <!-- 中间：盒子/包装箱（物料/产品） -->
  <g transform="translate(256,250)" filter="url(#glow2)">
    <!-- 盒子主体 -->
    <path d="M-55,20 L-55,-50 L0,-80 L55,-50 L55,20 Z" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round"/>
    <!-- 盒子左面 -->
    <line x1="-55" y1="-50" x2="-55" y2="20" stroke="white" stroke-width="5"/>
    <!-- 盒子右面 -->
    <line x1="55" y1="-50" x2="55" y2="20" stroke="white" stroke-width="5"/>
    <!-- 顶面中线 -->
    <line x1="0" y1="-80" x2="-55" y2="-50" stroke="white" stroke-width="4" stroke-opacity="0.6"/>
    <line x1="0" y1="-80" x2="55" y2="-50" stroke="white" stroke-width="4" stroke-opacity="0.6"/>
    <!-- 盒子前脸分割线 -->
    <line x1="0" y1="-50" x2="0" y2="20" stroke="white" stroke-width="2" stroke-opacity="0.4"/>
    <!-- IMS 字样 -->
    <text x="0" y="-2" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="white" fill-opacity="0.8">IMS</text>
  </g>
  <!-- 文字 -->
  <text x="256" y="458" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="bold" fill="white" fill-opacity="0.92">DL-IMS</text>
  <text x="256" y="486" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="white" fill-opacity="0.55">敦临计量</text>
</svg>