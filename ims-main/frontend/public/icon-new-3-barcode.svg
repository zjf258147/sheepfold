<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="shine3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg3)"/>
  <rect x="24" y="24" width="464" height="232" rx="96" fill="url(#shine3)"/>
  <!-- 中间：条形码 + 放大镜（追溯/扫描） -->
  <g transform="translate(256,250)" filter="url(#glow3)">
    <!-- 条形码 -->
    <rect x="-50" y="-35" width="5" height="60" rx="1.5" fill="white" opacity="0.85"/>
    <rect x="-41" y="-30" width="8" height="50" rx="1.5" fill="white" opacity="0.85"/>
    <rect x="-29" y="-35" width="3" height="60" rx="1" fill="white" opacity="0.85"/>
    <rect x="-22" y="-25" width="6" height="40" rx="1.5" fill="white" opacity="0.85"/>
    <rect x="-12" y="-35" width="4" height="60" rx="1" fill="white" opacity="0.85"/>
    <rect x="-4" y="-20" width="9" height="30" rx="1.5" fill="white" opacity="0.85"/>
    <rect x="8" y="-35" width="3" height="60" rx="1" fill="white" opacity="0.85"/>
    <rect x="15" y="-30" width="7" height="50" rx="1.5" fill="white" opacity="0.85"/>
    <rect x="26" y="-35" width="4" height="60" rx="1" fill="white" opacity="0.85"/>
    <rect x="34" y="-25" width="8" height="40" rx="1.5" fill="white" opacity="0.85"/>
    <rect x="46" y="-35" width="5" height="60" rx="1.5" fill="white" opacity="0.85"/>
  </g>
  <!-- 文字 -->
  <text x="256" y="458" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="bold" fill="white" fill-opacity="0.92">DL-IMS</text>
  <text x="256" y="486" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="white" fill-opacity="0.55">敦临计量</text>
</svg>