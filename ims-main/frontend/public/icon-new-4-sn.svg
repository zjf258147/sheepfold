<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="shine4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg4)"/>
  <rect x="24" y="24" width="464" height="232" rx="96" fill="url(#shine4)"/>
  <!-- 中间：四叶草/花瓣（品质/生命） -->
  <g transform="translate(256,245)" filter="url(#glow4)">
    <!-- 四片叶子 -->
    <ellipse cx="0" cy="-40" rx="28" ry="38" fill="white" opacity="0.25"/>
    <ellipse cx="0" cy="40" rx="28" ry="38" fill="white" opacity="0.25"/>
    <ellipse cx="-40" cy="0" rx="38" ry="28" fill="white" opacity="0.25"/>
    <ellipse cx="40" cy="0" rx="38" ry="28" fill="white" opacity="0.25"/>
    <!-- 中心圆 -->
    <circle cx="0" cy="0" r="18" fill="white" opacity="0.7"/>
    <!-- 十字线 -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="white" stroke-width="3" opacity="0.3"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="white" stroke-width="3" opacity="0.3"/>
    <!-- SN 字样 -->
    <text x="0" y="7" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#7C3AED" opacity="0.9">SN</text>
  </g>
  <!-- 文字 -->
  <text x="256" y="458" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="bold" fill="white" fill-opacity="0.92">DL-IMS</text>
  <text x="256" y="486" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="white" fill-opacity="0.55">敦临计量</text>
</svg>