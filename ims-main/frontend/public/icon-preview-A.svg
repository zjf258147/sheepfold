<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="shineA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowA">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgA)"/>
  <!-- 光泽层 -->
  <rect x="24" y="24" width="464" height="232" rx="96" fill="url(#shineA)"/>
  <!-- 盾牌轮廓 -->
  <path d="M256 120 L330 155 L330 270 Q330 350 256 400 Q182 350 182 270 L182 155 Z" fill="none" stroke="white" stroke-width="6" stroke-opacity="0.3"/>
  <!-- 闪电符号 -->
  <path d="M250 180 L210 260 L245 260 L220 340 L300 240 L260 240 L290 180 Z" fill="white" filter="url(#glowA)"/>
  <!-- 底部文字 -->
  <text x="256" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="white" fill-opacity="0.9">DL-IMS</text>
  <text x="256" y="478" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white" fill-opacity="0.6">敦临计量</text>
</svg>