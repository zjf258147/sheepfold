<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glowB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgB)"/>
  <!-- 外齿轮 -->
  <g transform="translate(256,220)" fill="none" stroke="white" stroke-width="5" stroke-opacity="0.4">
    <circle r="90"/>
    <circle r="70" stroke-opacity="0.2"/>
  </g>
  <!-- 齿轮齿 -->
  <g transform="translate(256,220)" fill="white" fill-opacity="0.3">
    <rect x="-12" y="-110" width="24" height="40" rx="4"/>
    <rect x="-12" y="70" width="24" height="40" rx="4"/>
    <rect x="-110" y="-12" width="40" height="24" rx="4"/>
    <rect x="70" y="-12" width="40" height="24" rx="4"/>
    <rect x="50" y="-95" width="24" height="40" rx="4" transform="rotate(45,62,-75)"/>
    <rect x="-95" y="50" width="24" height="40" rx="4" transform="rotate(45,-83,70)"/>
    <rect x="50" y="55" width="24" height="40" rx="4" transform="rotate(-45,62,75)"/>
    <rect x="-95" y="-90" width="24" height="40" rx="4" transform="rotate(-45,-83,-70)"/>
  </g>
  <!-- 条形码 -->
  <g transform="translate(256,220)" fill="white" filter="url(#glowB)">
    <rect x="-35" y="-30" width="4" height="60" rx="1"/>
    <rect x="-28" y="-25" width="6" height="50" rx="1"/>
    <rect x="-19" y="-30" width="2" height="60" rx="1"/>
    <rect x="-14" y="-20" width="5" height="40" rx="1"/>
    <rect x="-6" y="-30" width="3" height="60" rx="1"/>
    <rect x="0" y="-15" width="7" height="30" rx="1"/>
    <rect x="10" y="-30" width="2" height="60" rx="1"/>
    <rect x="15" y="-25" width="5" height="50" rx="1"/>
    <rect x="23" y="-30" width="3" height="60" rx="1"/>
    <rect x="29" y="-20" width="6" height="40" rx="1"/>
  </g>
  <!-- 橙色装饰线 -->
  <line x1="136" y1="130" x2="376" y2="130" stroke="url(#accentB)" stroke-width="4" stroke-linecap="round"/>
  <!-- 文字 -->
  <text x="256" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="white" fill-opacity="0.95">DL-IMS</text>
  <text x="256" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#F59E0B" fill-opacity="0.8">生产追溯系统</text>
</svg>