<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="goldC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glowC">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgC)"/>
  <!-- 盾牌 -->
  <path d="M256 100 L350 145 L350 280 Q350 370 256 420 Q162 370 162 280 L162 145 Z" fill="none" stroke="url(#goldC)" stroke-width="5" stroke-opacity="0.7"/>
  <!-- 对勾 -->
  <path d="M200 275 L240 315 L320 210" fill="none" stroke="url(#goldC)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowC)"/>
  <!-- SN 链条 -->
  <g transform="translate(256,170)" fill="none" stroke="white" stroke-width="4" stroke-opacity="0.5">
    <circle cx="-50" cy="0" r="12"/>
    <circle cx="0" cy="0" r="12"/>
    <circle cx="50" cy="0" r="12"/>
    <line x1="-38" y1="-10" x2="-12" y2="-10"/>
    <line x1="12" y1="-10" x2="38" y2="-10"/>
  </g>
  <!-- 文字 -->
  <text x="256" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="url(#goldC)">DL-IMS</text>
  <text x="256" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="white" fill-opacity="0.5">品质追溯 · 闭环管理</text>
</svg>