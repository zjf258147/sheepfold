<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accentD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glowD">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgD)"/>
  <!-- 六边形外框 -->
  <g transform="translate(256,210)" fill="none" stroke="white" stroke-opacity="0.25" stroke-width="3">
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55"/>
  </g>
  <!-- 六边形内框 -->
  <g transform="translate(256,210)" fill="none" stroke="url(#accentD)" stroke-opacity="0.5" stroke-width="4">
    <polygon points="0,-85 74,-42 74,42 0,85 -74,42 -74,-42"/>
  </g>
  <!-- 放大镜 -->
  <g transform="translate(256,210)" filter="url(#glowD)">
    <circle cx="-5" cy="-5" r="38" fill="none" stroke="url(#accentD)" stroke-width="8"/>
    <line x1="22" y1="22" x2="48" y2="48" stroke="url(#accentD)" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- 二维码小方块装饰 -->
  <g fill="white" fill-opacity="0.15">
    <rect x="110" y="340" width="8" height="8" rx="1"/>
    <rect x="110" y="352" width="8" height="8" rx="1"/>
    <rect x="122" y="340" width="8" height="8" rx="1"/>
    <rect x="134" y="352" width="8" height="8" rx="1"/>
    <rect x="370" y="340" width="8" height="8" rx="1"/>
    <rect x="382" y="352" width="8" height="8" rx="1"/>
    <rect x="394" y="340" width="8" height="8" rx="1"/>
    <rect x="370" y="364" width="8" height="8" rx="1"/>
  </g>
  <!-- 文字 -->
  <text x="256" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="white" fill-opacity="0.95">DL-IMS</text>
  <text x="256" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#94A3B8">智能制造追溯</text>
</svg>